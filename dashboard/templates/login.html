<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Sign in — Fernhill Stays</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css', v=asset_v) }}">
</head>
<body>
  <main class="login">
    <div class="login-box">
      <div class="brand-row"><div class="mark">FS</div><div><strong>Fernhill</strong><div class="note">Stays</div></div></div>
      <h1 style="font-size:22px; margin-top:var(--s5)">Sign in</h1>
      <p class="subtitle mb4">Sign in with your own username and password.</p>
      {% if error %}<div class="flash error" role="alert">{{ error }}</div>{% endif %}
      <form method="post" action="{{ url_for('auth.login') }}">
        <input type="hidden" name="next" value="{{ next }}">
        <input type="text" name="username" value="{{ username or '' }}" placeholder="Username" {{ '' if username else 'autofocus' }} required autocomplete="username" autocapitalize="none" spellcheck="false" aria-label="Username" style="width:100%; height:38px; margin-bottom:var(--s3)">
        <input type="password" name="password" placeholder="Password" {{ 'autofocus' if username else '' }} required autocomplete="current-password" aria-label="Password" style="width:100%; height:38px; margin-bottom:var(--s3)">
        <button type="submit" style="width:100%; height:38px">Sign in</button>
      </form>
    </div>
  </main>
</body>
</html>
